spring:
  application:
    name: automated-fuel-quota

  datasource:
    url: jdbc:postgresql://localhost:5432/automated_fuel_quota
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    require-ssl: false

# Application specific configuration
app:
  jwt:
    secret: "automated-fuel-quota-system-secret-key-2026-very-long-secret-for-jwt-signing"
    expiration-ms: 86400000  # 24 hours
    qr-expiration-ms: 3600000  # 1 hour for QR tokens

  quota:
    limit-litres: 24.0                         # Fuel limit per period
    geofence-radius-meters: 100
    period: WEEKLY                              # DAILY | WEEKLY | MONTHLY | QUARTERLY | YEARLY
    reset-cron-expression: "0 0 0 ? * SUN"     # Cron must match the chosen period

# Management/Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# Logging configuration
logging:
  level:
    io.github.eendroroy.fuelquota: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # Suppress 404 stack traces for missing static resources (e.g. Chrome DevTools probe)
    org.springframework.web.servlet.resource: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

